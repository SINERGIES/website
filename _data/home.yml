hero:
  title: Relier les savoirs pour transformer la santé.
  subtitle: Soins intégrés, nanomédecine, intelligence artificielle et ingénierie au service de recherches profondément humaines.
  cta: Découvrir les axes de recherche
  image: /assets/img/header-laboratory-v2.jpg
  stats:
    - value: "3"
      label: équipes de recherche
    - value: "3"
      label: axes transversaux
    - value: "1"
      label: master

intro:
  body: Le Laboratoire SINERGIES réunit physiciens, chimistes, biologistes et médecins autour de projets translationnels qui mobilisent des expertises nano, micro et macro pour comprendre, diagnostiquer et traiter les maladies.
  principles:
    - title: Multidisciplinaire
      text: Physique, chimie, biologie et médecine.
    - title: Translationnel
      text: De la preuve de concept au bénéfice patient.
    - title: Données & IA
      text: Biostatistiques, modèles et apprentissage automatique.

axes:
  title: Axes de recherche
  text: Le laboratoire articule ses travaux autour de trois équipes de recherche, soutenues par trois axes transversaux.
  research_title: Équipes de recherche
  transversal_title: Axes transversaux
  research:
    - title: Soins intégrés et personnalisés
      text: Analyse des parcours, épidémiologie clinique et données de santé pour soutenir une prise en charge personnalisée.
    - title: Biomarqueurs et cibles thérapeutiques
      text: Identification de signatures biologiques et validation de cibles pour accélérer le transfert vers la recherche clinique.
    - title: Ingénierie pour la santé
      text: Conception de matériaux, microdispositifs, imagerie et instrumentation au service du diagnostic et du soin.
  transversal:
    - title: Intelligence artificielle
      text: Modèles, apprentissage automatique et biostatistiques pour valoriser les données biomédicales.
    - title: Recherche clinique
      text: Méthodologies, protocoles et appui au transfert des preuves scientifiques vers les patients.
    - title: Imageries 2D, 3D, 4D
      text: Développement et intégration de protocoles d'imagerie multimodale pour documenter les trajectoires de soin.

projects:
  title: Projets du laboratoire
  text: "Des projets construits avec les équipes cliniques, académiques et industrielles pour faire avancer les méthodes, les outils et les usages en santé."
  cta: Voir tous les projets

teams:
  - title: Soins intégrés et personnalisés
    text: Analyse des parcours de soins, épidémiologie clinique et données de santé pour soutenir une prise en charge intégrée, personnalisée et mesurable.
  - title: Biomarqueurs et cibles thérapeutiques
    text: Identification de biomarqueurs, exploration des mécanismes biologiques et validation de cibles thérapeutiques pour accélérer le transfert vers la recherche clinique.
  - title: Ingénierie pour la santé
    text: Conception de matériaux, nano et microdispositifs, solutions d'imagerie et instrumentation pour développer des outils fiables au service du diagnostic et du soin.

master:
  title: Master Ingénierie de la santé
  text: Une formation adossée aux expertises du laboratoire pour préparer les étudiants aux méthodes, outils et enjeux de la recherche en santé. Le parcours met en relation les sciences du vivant, l'ingénierie, les données, l'imagerie et la recherche clinique, avec une attention particulière portée au transfert vers les usages hospitaliers et les projets translationnels.
  note: Les étudiants peuvent découvrir les problématiques du laboratoire, construire un projet de recherche et se rapprocher des équipes impliquées dans les axes scientifiques de SINERGIES.
  highlights:
    - Recherche clinique et méthodologie
    - Ingénierie, imagerie et données de santé
    - Immersion dans un environnement hospitalo-universitaire
  cta: Plus d'information
  url: /master-2/

about:
  title: À propos de nous
  vision_title: Notre vision
  vision: Construire une recherche biomédicale ouverte, rigoureuse et utile, capable de relier les avancées scientifiques aux besoins concrets des patients, des soignants et des partenaires du territoire.
  lab_title: Le laboratoire
  lab: SINERGIES rassemble des expertises en physique, chimie, biologie, médecine, données et ingénierie pour faire émerger des projets translationnels, depuis les mécanismes fondamentaux jusqu'à l'évaluation clinique.
  direction_title: Équipe de direction

