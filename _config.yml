title: Laboratoire SINERGIES
description: Expertise multidisciplinaire en santé et recherche clinique.
url: "https://servopuma.github.io"
baseurl: "/sinergies"
lang: fr
timezone: Europe/Paris

markdown: kramdown
permalink: pretty

collections:
  publications:
    output: true
    permalink: /publications/:name/
  projects:
    output: true
    permalink: /projets/:name/
  people:
    output: true
    permalink: /membres/:name/
  teams:
    output: true
    permalink: /equipes/:name/
  axes:
    output: true
    permalink: /axes/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: people
    values:
      layout: person
  - scope:
      path: ""
      type: teams
    values:
      layout: team
  - scope:
      path: ""
      type: axes
    values:
      layout: axis

exclude:
  - .bundle
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - _site
  - outputs
  - scripts
  - tools
  - vendor
