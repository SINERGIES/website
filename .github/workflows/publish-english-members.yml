name: Publish English member pages
on:
  push:
    paths:
      - ".github/workflows/publish-english-members.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the prepared website update
        run: |
          echo "" | base64 --decode > /tmp/sinergies-update.tar.gz
          tar -xzf /tmp/sinergies-update.tar.gz
          rm .github/workflows/publish-english-members.yml
          git config user.name "SINERGIES website publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish English versions of member profiles"
          git push origin HEAD:main
