---
layout: default
---

<article class="page-hero post-page">
  <p class="meta">{{ page.year }}{% if page.journal %} · {{ page.journal }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.authors %}
    <p>{{ page.authors }}</p>
  {% endif %}
</article>

<section class="page-content">
  {{ content }}
  {% if page.doi %}
    <p><a class="button" href="https://doi.org/{{ page.doi }}">Ouvrir le DOI</a></p>
  {% endif %}
</section>
