<footer class="site-footer" id="contact">
  <div class="partner-band" aria-label="Partenaires">
    {% for partner in site.data.home.partners %}
      <a class="partner-logo" href="{{ partner.url }}" aria-label="{{ partner.full_name }}" target="_blank" rel="noopener">
        <img src="{{ partner.logo | relative_url }}" alt="{{ partner.full_name }}">
      </a>
    {% endfor %}
  </div>
  <div class="footer-grid">
    <a class="brand footer-brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo-sinergies.png' | relative_url }}" alt="Laboratoire SINERGIES">
    </a>
    <address>
      16 route de Gray<br>
      25000 Besançon
    </address>
    <div class="footer-contact">
      <a href="mailto:contact@sinergies-lab.fr">contact@sinergies-lab.fr</a>
    </div>
    <div class="footer-links">
      <a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a>
      <a href="{{ '/accessibilite/' | relative_url }}">Accessibilité</a>
      <a href="{{ '/plan-du-site/' | relative_url }}">Plan du site</a>
    </div>
  </div>
</footer>
